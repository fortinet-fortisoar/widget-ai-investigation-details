<div>
    <uib-tabset>
        <uib-tab heading="{{ :: 'aiInvestigationDetails.ACCORDION_TITLE_HIGHLIGHTS' | translate }}">
            <div class="line-ht-verdict-accordion padding-md font-size-14 mdEditor" id="verdict-md" data-ng-bind-html="::finalSummary.mdSummary">
            </div>
        </uib-tab>

        <uib-tab heading="{{ :: 'aiInvestigationDetails.ACCORDION_TITLE_KEY_FINDINGS' | translate }}">
            <!-- key findings accordion -->
            <div class="font-size-14 font-weight-200 padding-lg key_findings">
                <uib-accordion close-others="false">
                    <div uib-accordion-group is-open="status.open" class="queue-card-wrapper panel-default"
                        data-ng-class="findings.importance.toLowerCase()"
                        data-ng-repeat="findings in finalSummary.key_findings | orderBy:getImportanceOrder:true">
                        <uib-accordion-heading class="ai-content-heading">
                            <div class="display-flex accordion-spacing">
                                <div class="keyFindingTitle truncate margin-right-md" title="{{findings.name}}">
                                    {{findings.name}}
                                </div>
                                <i class="margin-top-xsm fa pull-left font-08em"
                                    ng-class="{'fa-chevron-right': !status.open, 'fa-chevron-down': status.open}"></i>
                            </div>
                        </uib-accordion-heading>
                        <div class="padding-left-md padding-md line-height-xlg">
                            <div class="accordion-content">
                                {{findings.details}}
                            </div>
                        </div>
                    </div>
                </uib-accordion>
            </div>
        </uib-tab>

        <uib-tab heading="{{ :: 'aiInvestigationDetails.ACCORDION_TITLE_NEXT_STEPS' | translate }}">
            <div class="nextStepsFlexContent font-size-14 padding-top-lg line-ht-verdict-accordion">
                <ul>
                    <li data-ng-repeat="steps in finalSummary.next_action_steps track by $index">{{steps}}</li>
                </ul>
            </div>
        </uib-tab>
    </uib-tabset>
</div>
