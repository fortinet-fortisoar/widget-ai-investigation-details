<div class="display-flex full-height align-items-center">
  <div class="trace-flow-block full-height">

      <span class="content-box cursor-pointer" data-ng-click="closeTraceFlow()">
        x

      <div class="scaled-container">
        <div data-cs-widget class="full-height full-width"

      </div>
    </div>
  </div>
</div>
